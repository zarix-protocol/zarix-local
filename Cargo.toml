[package]
name = "zarix-local"
version = "1.1.0"
edition = "2024"
description = "Desktop staking tool for ZARIX tokens"
license = "MIT"
repository = "https://github.com/zarix-protocol/zarix-local"
authors = ["Zarix Team"]

[dependencies]
actix-web = "4"
actix-files = "0.6"
reqwest = { version = "0.12", features = ["json"] }
serde_json = "1"
rust-embed = "8"
mime_guess = "2"
tokio = { version = "1", features = ["full"] }
open = "5"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
